<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPulse - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 448px;
      min-height: 100vh;
      background: #fff;
      padding-bottom: 96px;
      overflow: hidden;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 13px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #f1f5f9;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(45deg, #4f46e5 0%, #6366f1 50%, #a855f7 100%);
      box-shadow: 0 4px 6px -1px rgba(99,102,241,.25);
      display: grid; place-items: center; color: #fff; font-size: 18px;
    }
    .brand-title { display: flex; align-items: center; gap: 6px; }
    .brand-title h1 { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 18px; color: #0f172a; letter-spacing: -.45px; }
    .badge {
      background: #eef2ff; color: #4f46e5; font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: .5px;
    }
    .date { font-size: 11px; color: #94a3b8; font-weight: 500; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
      display: grid; place-items: center; font-size: 15px; background: #f1f5f9; color: #475569;
    }
    .icon-btn.ai-chat { padding: 0; overflow: hidden; background: #fff; }
    .ai-icon { display: block; width: 100%; height: 100%; object-fit: contain; }
    .icon-btn.primary {
      background: #4f46e5; color: #fff; box-shadow: 0 10px 15px -3px rgba(79,70,229,.3);
    }

    /* Main */
    .content { padding: 16px 20px; display: flex; flex-direction: column; gap: 20px; }

    /* Balance card */
    .balance-card {
      position: relative; overflow: hidden; border-radius: 24px; padding: 24px;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      box-shadow: 0 10px 25px -5px rgba(99,102,241,.35);
      color: #fff;
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(30px); pointer-events: none; }
    .blob.a { width: 176px; height: 176px; right: -40px; bottom: -40px; background: rgba(168,85,247,.2); }
    .blob.b { width: 128px; height: 128px; left: -24px; top: -24px; background: rgba(129,140,248,.2); }
    .balance-top { display: flex; justify-content: space-between; align-items: center; position: relative; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #c7d2fe; }
    .pill {
      font-size: 11px; font-weight: 500; color: #6ee7b7; padding: 3px 11px; border-radius: 999px;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(12px);
    }
    .balance {
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 30px;
      letter-spacing: -.75px; margin: 8px 0 12px; position: relative;
    }
    .counters {
      display: flex; gap: 12px; border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 17px; position: relative;
    }
    .counter {
      flex: 1; border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 4px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.05);
    }
    .counter-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c7d2fe; font-weight: 500; }
    .dot {
      width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px;
    }
    .dot.in { background: rgba(16,185,129,.2); color: #6ee7b7; }
    .dot.out { background: rgba(244,63,94,.2); color: #fda4af; }
    .counter-value { font-weight: 700; font-size: 16px; }

    /* Panels */
    .panel {
      background: #fff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 17px;
      display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 1px rgba(0,0,0,.05);
    }
    .row-between { display: flex; justify-content: space-between; align-items: center; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #94a3b8; }
    .sub { font-size: 12px; font-weight: 600; color: #334155; }
    .tabs {
      display: flex; gap: 4px; padding: 4px; background: #f1f5f9; border-radius: 12px;
    }
    .tab {
      border: none; background: transparent; font: inherit; font-size: 12px; font-weight: 500;
      color: #475569; padding: 4px 10px; border-radius: 8px; cursor: pointer;
    }
    .tab.active { background: #fff; color: #4f46e5; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .period-grid { display: flex; gap: 12px; }
    .period-box {
      flex: 1; padding: 13px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .period-box.income { background: rgba(236,253,245,.7); border: 1px solid rgba(209,250,229,.8); }
    .period-box.expense { background: rgba(255,241,242,.7); border: 1px solid rgba(255,228,230,.8); }
    .period-label { font-size: 11px; font-weight: 600; }
    .income .period-label { color: #047857; }
    .expense .period-label { color: #be123c; }
    .period-value { font-weight: 700; font-size: 18px; }
    .income .period-value { color: #065f46; }
    .expense .period-value { color: #9f1239; }

    /* Pie chart */
    .pie-wrap { display: flex; align-items: center; gap: 16px; }
    .pie-svg { width: 150px; height: 150px; flex-shrink: 0; }
    .pie-svg path { transition: opacity .2s ease, transform .2s ease; transform-origin: 80px 80px; cursor: pointer; }
    .pie-svg path:hover { opacity: .85; transform: scale(1.03); }
    .legend { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .legend-row { display: flex; flex-direction: column; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .legend-name { color: #475569; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .legend-pct { color: #0f172a; font-weight: 700; }
    .legend-amt { color: #94a3b8; font-size: 11px; padding-left: 18px; margin-top: 2px; }

    /* Insight card */
    .insight {
      display: flex; gap: 14px; padding: 17px; border-radius: 16px;
      border: 1px solid rgba(224,231,255,.6);
      background: linear-gradient(90deg, #eef2ff 0%, #faf5ff 50%, #fdf2f8 100%);
      box-shadow: 0 1px 1px rgba(0,0,0,.05);
    }
    .insight-icon {
      width: 40px; height: 40px; flex-shrink: 0; border-radius: 16px; background: #4f46e5; color: #fff;
      display: grid; place-items: center; font-size: 18px; box-shadow: 0 4px 6px -1px rgba(79,70,229,.2);
    }
    .insight-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .insight-head { display: flex; justify-content: space-between; align-items: center; }
    .insight-title { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #312e81; }
    .ai-tag {
      background: #fff; border: 1px solid #e0e7ff; color: #4f46e5; font-size: 10px; font-weight: 600;
      padding: 3px 9px; border-radius: 999px;
    }
    .insight-text { font-size: 12px; line-height: 19.5px; color: #334155; }
    .insight-text b { font-weight: 700; }
    .insight-cat { font-size: 11px; font-weight: 500; color: #4338ca; margin-top: 4px; }
    .insight-cat b { text-decoration: underline; font-weight: 700; }

    /* Quick actions */
    .actions { display: flex; gap: 12px; }
    .action {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 0; border-radius: 16px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .action.income { background: #ecfdf5; border: 1px solid rgba(167,243,208,.6); color: #047857; }
    .action.expense { background: #fff1f2; border: 1px solid rgba(254,205,211,.6); color: #be123c; }

    /* Transactions */
    .section-head { display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px; color: #0f172a; }
    .link { font-size: 12px; font-weight: 600; color: #4f46e5; background: none; border: none; cursor: pointer; font-family: inherit; }
    .tx-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .tx {
      display: flex; justify-content: space-between; align-items: center; padding: 15px;
      background: #fff; border: 1px solid #f1f5f9; border-radius: 16px; box-shadow: 0 1px 1px rgba(0,0,0,.05);
    }
    .tx-left { display: flex; align-items: center; gap: 12px; }
    .tx-icon {
      width: 40px; height: 40px; border-radius: 16px; display: grid; place-items: center; font-size: 16px; flex-shrink: 0;
    }
    .tx-name { font-weight: 700; font-size: 12px; color: #1e293b; }
    .tx-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .tx-meta span.cat { color: #475569; font-weight: 500; }
    .tx-amount { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12px; white-space: nowrap; }
    .neg { color: #e11d48; }
    .pos { color: #059669; }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 448px; z-index: 4;
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 16px; background: rgba(255,255,255,.95);
      backdrop-filter: blur(16px); border-top: 1px solid rgba(226,232,240,.8);
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 12px;
      border: none; background: none; font: inherit; font-size: 10px; font-weight: 500;
      color: #94a3b8; cursor: pointer; letter-spacing: -.25px;
    }
    .nav-btn.active { color: #4f46e5; font-weight: 600; }
    .nav-btn .ico { font-size: 16px; }
    .fab {
      width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
      background: linear-gradient(45deg, #4f46e5, #9333ea); color: #fff; font-size: 22px;
      display: grid; place-items: center; margin-top: -24px;
      box-shadow: 0 10px 15px -3px rgba(79,70,229,.4), 0 4px 6px -4px rgba(79,70,229,.4);
    }

    /* Toast */
    .toast {
      position: fixed; top: 16px; left: 50%; transform: translate(-50%, -20px);
      background: #1e293b; color: #fff; font-size: 14px; font-weight: 600;
      padding: 12px 16px; border-radius: 16px; display: flex; gap: 12px; align-items: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1);
      opacity: 0; pointer-events: none; transition: all .3s ease; white-space: nowrap; z-index: 10;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .transaction-dialog {
      width: min(400px, calc(100% - 32px)); margin: auto; padding: 24px;
      border: none; border-radius: 20px; box-shadow: 0 20px 50px rgba(15,23,42,.2);
      font: inherit; color: #0f172a;
    }
    .transaction-dialog::backdrop { background: rgba(15,23,42,.45); }
    .dialog-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
    .dialog-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .dialog-field label { font-size: 12px; font-weight: 600; color: #475569; }
    .dialog-field input {
      width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 10px;
      font: inherit; font-size: 14px;
    }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .dialog-actions button {
      padding: 10px 14px; border: 0; border-radius: 10px; font: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .dialog-cancel { background: #f1f5f9; color: #475569; }
    .dialog-submit { background: #4f46e5; color: #fff; }
    .empty-state { padding: 18px; text-align: center; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">▣</div>
        <div class="brand-title">
          <h1>FinPulse</h1>
          <span class="badge">Smart</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn ai-chat" onclick="window.location.href='ai.html'" aria-label="Open FinPulse AI">
          <img class="ai-icon" src="ai-logo.png" alt="" />
        </button>
      </div>
    </header>

    <main class="content">
      <section class="balance-card">
        <div class="blob a"></div>
        <div class="blob b"></div>
        <div class="balance-top">
          <div class="label">Total Available Balance</div>
          <div class="pill">Balance</div>
        </div>
        <div class="balance" id="available-balance">₹0.00</div>
        <div class="counters">
          <div class="counter">
            <div class="counter-head"><span class="dot in">↙</span> Income</div>
            <div class="counter-value" id="total-income">₹0.00</div>
          </div>
          <div class="counter">
            <div class="counter-head"><span class="dot out">↗</span> Expenses</div>
            <div class="counter-value" id="total-expense">₹0.00</div>
          </div>
        </div>
      </section>

      <!-- Expense breakdown pie chart -->
      <section class="panel">
        <div class="row-between">
          <div>
            <div class="eyebrow">Expense Breakdown Reference</div>
            <div class="sub" id="pie-summary"></div>
          </div>
        </div>
        <div class="pie-wrap">
          <svg class="pie-svg" viewBox="0 0 160 160" id="pieChart" aria-label="Expense breakdown pie chart"></svg>
          <div class="legend" id="pieLegend"></div>
        </div>
      </section>

      <!-- Transaction history -->
      <section class="panel">
        <div class="section-head">
          <div class="section-title">Transaction History</div>
        </div>
        <div class="actions">
          <button class="action income" onclick="openTransactionDialog('income')">⊕ Add Income</button>
          <button class="action expense" onclick="openTransactionDialog('expense')">⊖ Add Expense</button>
        </div>
        <div class="tx-list" id="transaction-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="window.location.href='dashboard.html'"><span class="ico">⌂</span>Dashboard</button>
      <button class="nav-btn" onclick="window.location.href='trans.html'"><span class="ico">≡</span>Transactions</button>
      <button class="fab" onclick="openTransactionDialog('income')" aria-label="Add">+</button>
      <button class="nav-btn" onclick="window.location.href='ana.html'"><span class="ico">◔</span>Analytics</button>
      <button class="nav-btn" onclick="window.location.href='set.html'"><span class="ico">⚟</span>Settings</button>
    </nav>

    <div class="toast" id="toast">✓ Action completed successfully</div>
  </div>

  <dialog class="transaction-dialog" id="transaction-dialog">
    <form id="transaction-form">
      <div class="dialog-title" id="dialog-title">Add Income</div>
      <div class="dialog-field">
        <label for="transaction-category">Category</label>
        <input id="transaction-category" name="category" type="text" maxlength="40" placeholder="Optional" />
      </div>
      <div class="dialog-field">
        <label for="transaction-amount">Amount (₹)</label>
        <input id="transaction-amount" name="amount" type="number" min="0.01" step="0.01" required />
      </div>
      <div class="dialog-actions">
        <button class="dialog-cancel" type="button" onclick="closeTransactionDialog()">Cancel</button>
        <button class="dialog-submit" type="submit" id="transaction-submit">Add Income</button>
      </div>
    </form>
  </dialog>

  <script>
    const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbyVQBygHAXT1VRmvFGV7iDzKkNMRcQyW4hyf1Bp7v-p18pqwu3DaTt9sFICcLtA3C88/exec';
    const chartColors = ['#4f46e5', '#a855f7', '#f59e0b', '#10b981', '#cbd5e1'];
    let transactions = [];
    let transactionsLoaded = false;
    let transactionLoadError = '';
    let transactionType = 'income';

    const formatCurrency = cents => new Intl.NumberFormat('en-IN', {
      style: 'currency',
      currency: 'INR',
      minimumFractionDigits: 2
    }).format(cents / 100);

    async function callAppsScript(payload, method = 'GET') {
      const url = new URL(appsScriptUrl);
      const options = { method };
      if (method === 'GET') {
        Object.entries(payload).forEach(([key, value]) => url.searchParams.set(key, value));
      } else {
        options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
        options.body = JSON.stringify(payload);
      }

      const response = await fetch(url, options);
      if (!response.ok) {
        throw new Error(`Request failed (${response.status}).`);
      }
      const result = await response.json();
      if (result && result.error) {
        throw new Error(result.error);
      }
      return result;
    }

    async function loadCloudTransactions() {
      const rows = await callAppsScript({ action: 'getTransactions', limit: 500 });
      if (!Array.isArray(rows)) {
        throw new Error('Google Sheet returned an invalid transaction list.');
      }

      transactions = rows.map(transaction => {
          const category = String(transaction.category || '').trim();
          return {
            id: Number(transaction.id),
            type: transaction.type,
            amount: Math.round(Number(transaction.amount) * 100),
            category: !category || category === 'Others'
              ? 'Others'
              : category,
            createdAt: transaction.created_at || `${transaction.occurred_on}T00:00:00`
          };
        });
      transactionsLoaded = true;
      transactionLoadError = '';
      renderDashboard();
    }

    function renderDashboard() {
      const currentDate = new Date();
      const currentMonth = currentDate.getMonth();
      const currentYear = currentDate.getFullYear();
      const countedTransactions = transactions.filter(transaction => {
        const createdAt = Date.parse(transaction.createdAt);
        return Number.isFinite(createdAt) &&
          (transaction.type === 'income' || transaction.type === 'expense') &&
          Number.isFinite(Number(transaction.amount));
      });
      const totalIncome = countedTransactions
        .filter(transaction => transaction.type === 'income')
        .reduce((total, transaction) => total + transaction.amount, 0);
      const totalExpense = countedTransactions
        .filter(transaction => transaction.type === 'expense')
        .reduce((total, transaction) => total + transaction.amount, 0);
      const monthTransactions = countedTransactions.filter(transaction => {
        const date = new Date(transaction.createdAt);
        return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
      });
      const monthExpense = monthTransactions
        .filter(transaction => transaction.type === 'expense')
        .reduce((total, transaction) => total + transaction.amount, 0);

      document.getElementById('available-balance').textContent = formatCurrency(totalIncome - totalExpense);
      document.getElementById('total-income').textContent = formatCurrency(totalIncome);
      document.getElementById('total-expense').textContent = formatCurrency(totalExpense);
      document.getElementById('pie-summary').textContent =
        `${currentDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })} · ${formatCurrency(monthExpense)}`;

      const list = document.getElementById('transaction-list');
      list.replaceChildren();
      if (!transactionsLoaded) {
        const loadingState = document.createElement('div');
        loadingState.className = 'empty-state';
        loadingState.textContent = transactionLoadError
          ? `Could not load transactions: ${transactionLoadError}`
          : 'Loading transactions...';
        list.append(loadingState);
      } else if (transactions.length === 0) {
        const emptyState = document.createElement('div');
        emptyState.className = 'empty-state';
        emptyState.textContent = 'No transactions in Google Sheet yet. Add income or an expense to start your history.';
        list.append(emptyState);
      } else {
        [...transactions].reverse().forEach(transaction => {
          const isIncome = transaction.type === 'income';
          const item = document.createElement('div');
          item.className = 'tx';
          const left = document.createElement('div');
          left.className = 'tx-left';
          const icon = document.createElement('div');
          icon.className = 'tx-icon';
          icon.style.background = isIncome ? '#d1fae5' : '#ffe4e6';
          icon.textContent = isIncome ? '↙' : '↗';
          const details = document.createElement('div');
          const name = document.createElement('div');
          name.className = 'tx-name';
          name.textContent = transaction.category || (isIncome ? 'Income' : 'Expense');
          const meta = document.createElement('div');
          meta.className = 'tx-meta';
          meta.textContent = `${transaction.category || (isIncome ? 'Income' : 'Other')} • ${new Date(transaction.createdAt).toLocaleString('en-IN')}`;
          details.append(name, meta);
          left.append(icon, details);
          const amount = document.createElement('div');
          amount.className = `tx-amount ${isIncome ? 'pos' : 'neg'}`;
          amount.textContent = `${isIncome ? '+' : '-'}${formatCurrency(transaction.amount)}`;
          item.append(left, amount);
          list.append(item);
        });
      }

      renderPie(monthTransactions
        .filter(transaction => transaction.type === 'expense')
        .reduce((categories, transaction) => {
          const category = transaction.category || 'Other';
          categories.set(category, (categories.get(category) || 0) + transaction.amount);
          return categories;
        }, new Map()));
    }

    function openTransactionDialog(type) {
      transactionType = type;
      const label = type === 'income' ? 'Income' : 'Expense';
      document.getElementById('dialog-title').textContent = `Add ${label}`;
      document.getElementById('transaction-submit').textContent = `Add ${label}`;
      document.getElementById('transaction-dialog').showModal();
      document.getElementById('transaction-amount').focus();
    }

    function closeTransactionDialog() {
      document.getElementById('transaction-dialog').close();
    }

    function showToast(message = '✓ Action completed successfully') {
      const t = document.getElementById('toast');
      t.textContent = message;
      t.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    function polarToXY(cx, cy, r, deg) {
      const rad = (deg - 90) * Math.PI / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    }

    function renderPie(categoryTotals) {
      const svg = document.getElementById('pieChart');
      const legend = document.getElementById('pieLegend');
      const cx = 80, cy = 80, r = 74;
      const entries = [...categoryTotals.entries()];
      const total = entries.reduce((sum, [, amount]) => sum + amount, 0);
      svg.replaceChildren();
      legend.replaceChildren();
      if (total === 0) {
        const emptyLegend = document.createElement('div');
        emptyLegend.className = 'empty-state';
        emptyLegend.textContent = 'No expenses yet.';
        legend.append(emptyLegend);
        return '';
      }

      let acc = 0;
      entries.forEach(([label, amount], index) => {
        const pct = amount / total * 100;
        const color = chartColors[index % chartColors.length];
        let shape;
        if (entries.length === 1) {
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          shape.setAttribute('cx', String(cx));
          shape.setAttribute('cy', String(cy));
          shape.setAttribute('r', String(r));
        } else {
          const start = acc / total * 360;
          const end = (acc + amount) / total * 360;
          const [x0, y0] = polarToXY(cx, cy, r, start);
          const [x1, y1] = polarToXY(cx, cy, r, end);
          const large = end - start > 180 ? 1 : 0;
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          shape.setAttribute('d', `M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`);
        }
        shape.setAttribute('fill', color);
        shape.setAttribute('stroke', '#fff');
        shape.setAttribute('stroke-width', '2');
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${label}: ${pct.toFixed(1)}%`;
        shape.append(title);
        svg.append(shape);

        const row = document.createElement('div');
        row.className = 'legend-row';
        const item = document.createElement('div');
        item.className = 'legend-item';
        const dot = document.createElement('span');
        dot.className = 'legend-dot';
        dot.style.background = color;
        const name = document.createElement('span');
        name.className = 'legend-name';
        name.textContent = label;
        const percentage = document.createElement('span');
        percentage.className = 'legend-pct';
        percentage.textContent = `${pct.toFixed(0)}%`;
        const formattedAmount = document.createElement('div');
        formattedAmount.className = 'legend-amt';
        formattedAmount.textContent = formatCurrency(amount);
        item.append(dot, name, percentage);
        row.append(item, formattedAmount);
        legend.append(row);
        acc += amount;
      });
      return entries.reduce((highest, current) => current[1] > highest[1] ? current : highest)[0];
    }

    document.getElementById('transaction-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const amount = Number(form.elements.amount.value);
      const amountInCents = Math.round(amount * 100);
      if (!Number.isFinite(amount) || !Number.isSafeInteger(amountInCents) || amountInCents <= 0) {
        form.elements.amount.setCustomValidity('Enter a valid amount greater than zero.');
        form.elements.amount.reportValidity();
        return;
      }
      form.elements.amount.setCustomValidity('');

      const category = form.elements.category.value.trim() || 'Others';
      const submitButton = document.getElementById('transaction-submit');
      submitButton.disabled = true;
      submitButton.textContent = 'Saving...';
      try {
        const result = await callAppsScript({
          action: 'addTransaction',
          type: transactionType,
          amount,
          category,
          title: transactionType === 'income' ? 'Income' : 'Expense',
          date: new Date().toLocaleDateString('en-CA')
        }, 'POST');
        if (!Number.isFinite(Number(result.id))) {
          throw new Error('Google Sheet did not confirm the transaction.');
        }

        transactions = [...transactions, {
          id: Number(result.id),
          type: transactionType,
          amount: amountInCents,
          category,
          createdAt: new Date().toISOString()
        }];
        transactionsLoaded = true;
        form.reset();
        closeTransactionDialog();
        renderDashboard();
        showToast('✓ Saved to Google Sheet');
      } catch (error) {
        showToast(`Could not save: ${error.message}`);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = `Add ${transactionType === 'income' ? 'Income' : 'Expense'}`;
      }
    });

    document.getElementById('transaction-amount').addEventListener('input', event => {
      event.currentTarget.setCustomValidity('');
    });

    renderDashboard();
    loadCloudTransactions().catch(error => {
      transactionsLoaded = false;
      transactionLoadError = error.message;
      renderDashboard();
      showToast(`Google Sheet sync failed: ${error.message}`);
    });
  </script>
</body>
</html>
