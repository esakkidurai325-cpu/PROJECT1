<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPulse - AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    button, input { font-family: inherit; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; height: 100vh; display: flex; justify-content: center; }

    .app { width: 100%; max-width: 448px; height: 100vh; background: #fff; display: flex; flex-direction: column; }

    /* Header */
    .header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #f1f5f9; }
    .back { width: 36px; height: 36px; border-radius: 50%; border: none; background: #f1f5f9; color: #475569; cursor: pointer; font-size: 16px; text-decoration: none; display: grid; place-items: center; }
    .logo { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(45deg, #4f46e5, #a855f7); color: #fff; display: grid; place-items: center; font-size: 16px; }
    .title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 17px; color: #0f172a; }
    .subtitle { font-size: 11px; color: #94a3b8; }

    /* Messages */
    .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 10px 13px; border-radius: 16px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px; }
    .msg.typing { color: #94a3b8; font-style: italic; }
    .msg.error { background: #fff1f2; color: #9f1239; }

    /* Suggestions */
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; }
    .chip { flex-shrink: 0; border: 1px solid #e2e8f0; background: #fff; color: #4f46e5; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
    .chip:disabled { opacity: .5; cursor: default; }

    /* Input */
    .composer { display: flex; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid #f1f5f9; }
    .composer input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 14px; outline: none; }
    .composer input:focus { background: #fff; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.12); }
    .send { padding: 0 18px; border-radius: 12px; border: none; background: #4f46e5; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
    .send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="back" href="dashboard.html" aria-label="Back">←</a>
      <div class="logo">✦</div>
      <div>
        <div class="title">FinPulse AI</div>
        <div class="subtitle">Unga maasa data vechu pesum</div>
      </div>
    </header>

    <div class="msgs" id="msgs"></div>

    <div class="chips">
      <button class="chip" onclick="send(this.textContent)">Ithu maasam ennaku evlo save aagum?</button>
      <button class="chip" onclick="send(this.textContent)">Edha kammi pannalam?</button>
      <button class="chip" onclick="send(this.textContent)">Ennoda biggest expense enna?</button>
      <button class="chip" onclick="send(this.textContent)">Goal ku evlo kammi irukku?</button>
    </div>

    <form class="composer" id="form">
      <input id="input" type="text" placeholder="Kelvi ketkalam..." autocomplete="off" maxlength="500" />
      <button class="send" id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <script>
    /* ================= CONFIG ================= */
    const API_URL = 'https://script.google.com/macros/s/AKfycbyVQBygHAXT1VRmvFGV7iDzKkNMRcQyW4hyf1Bp7v-p18pqwu3DaTt9sFICcLtA3C88/exec';

    /* ================= STATE ================= */
    const history = [];   // { role: 'user' | 'assistant', content: '...' }
    const msgs = document.getElementById('msgs');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const chips = document.querySelectorAll('.chip');

    /* ================= API ================= */
    // Apps Script CORS ku text/plain use pannrom
    async function apiPost(action, body = {}) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...body })
      });
      const responseText = await res.text();
      let data;
      try {
        data = JSON.parse(responseText);
      } catch {
        if (/<(?:!doctype|html)/i.test(responseText)) {
          throw new Error('Chat server returned an HTML page instead of JSON. Check the Apps Script deployment URL and access settings.');
        }
        throw new Error('Chat server returned an invalid JSON response.');
      }
      if (!res.ok) {
        throw new Error(`Chat request failed (${res.status}).`);
      }
      if (data.error) throw new Error(data.error);
      if (typeof data.reply !== 'string' || !data.reply.trim()) {
        throw new Error('Chat server response is missing a reply.');
      }
      return data;
    }

    /* ================= UI ================= */
    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      input.disabled = busy;
      chips.forEach(c => c.disabled = busy);
      if (!busy) input.focus();
    }

    /* ================= CHAT ================= */
    async function send(text) {
      text = String(text || '').trim();
      if (!text) return;

      const past = history.slice(-8);           // backend ku anuppura previous messages
      addMsg('user', text);
      history.push({ role: 'user', content: text });
      input.value = '';
      setBusy(true);

      const typing = addMsg('assistant', 'Thinking...');
      typing.classList.add('typing');

      try {
        const data = await apiPost('chat', { message: text, history: past });
        typing.textContent = data.reply;
        typing.classList.remove('typing');
        history.push({ role: 'assistant', content: data.reply });
      } catch (e) {
        typing.textContent = 'Error: ' + e.message;
        typing.classList.remove('typing');
        typing.classList.add('error');
        history.pop();                           // fail aana user message ah history la irundhu remove
      } finally {
        setBusy(false);
      }
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      send(input.value);
    });

    /* ================= INIT ================= */
    addMsg('assistant', 'Hi! Naan unga FinPulse AI. Unga income, expense, savings pathi enna venum nu kelvi kelunga.');
  </script>
</body>
</html>
