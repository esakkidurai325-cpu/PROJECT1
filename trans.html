<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPulse - Transaction History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    button, input, select { font-family: inherit; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; justify-content: center; }
    .app { position: relative; width: 100%; max-width: 448px; min-height: 100vh; background: #fff; padding-bottom: 96px; }

    /* Header */
    .header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 13px; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); border-bottom: 1px solid #f1f5f9; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(45deg, #4f46e5, #6366f1 50%, #a855f7); display: grid; place-items: center; color: #fff; font-size: 18px; box-shadow: 0 4px 6px -1px rgba(99,102,241,.25); }
    .brand-name { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 18px; color: #0f172a; letter-spacing: -.45px; }
    .badge { background: #eef2ff; color: #4f46e5; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: .5px; margin-left: 6px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; font-size: 15px; background: #f1f5f9; color: #475569; text-decoration: none; }
    .icon-btn:disabled { opacity: .5; cursor: default; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn.ai-chat { padding: 0; overflow: hidden; background: #fff; }
    .ai-icon { display: block; width: 100%; height: 100%; object-fit: contain; }

    .content { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
    .view-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px; color: #0f172a; letter-spacing: -.4px; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

    /* Summary */
    .summary { display: flex; gap: 12px; }
    .sum-box { flex: 1; padding: 13px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
    .sum-box.in { background: rgba(236,253,245,.7); border: 1px solid rgba(209,250,229,.8); }
    .sum-box.out { background: rgba(255,241,242,.7); border: 1px solid rgba(255,228,230,.8); }
    .sum-box.balance { background: rgba(238,242,255,.7); border: 1px solid rgba(224,231,255,.8); }
    .sum-label { font-size: 11px; font-weight: 600; }
    .in .sum-label { color: #047857; }
    .out .sum-label { color: #be123c; }
    .balance .sum-label { color: #4338ca; }
    .sum-value { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px; }
    .in .sum-value { color: #065f46; }
    .out .sum-value { color: #9f1239; }
    .balance .sum-value { color: #312e81; }

    /* Filters */
    .search {
      width: 100%; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1px solid #e2e8f0;
      background: #f8fafc; font-size: 14px; color: #0f172a; outline: none; position: relative;
    }
    .search:focus { background: #fff; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.12); }
    .search-wrap { position: relative; }
    .search-wrap span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px; pointer-events: none; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .chip { border: 1px solid #e2e8f0; background: #fff; color: #475569; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .chip.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .month-select { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 13px; color: #0f172a; outline: none; }

    /* Groups */
    .group { display: flex; flex-direction: column; gap: 10px; }
    .group-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
    .group-net { font-weight: 700; }
    .group-net.pos { color: #059669; }
    .group-net.neg { color: #e11d48; }

    .tx { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #fff; border: 1px solid #f1f5f9; border-radius: 16px; box-shadow: 0 1px 1px rgba(0,0,0,.05); }
    .tx-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .tx-icon { width: 40px; height: 40px; border-radius: 16px; display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
    .tx-name { font-weight: 700; font-size: 13px; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .tx-meta .cat { color: #475569; font-weight: 500; }
    .tx-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .tx-amount { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .neg { color: #e11d48; }
    .pos { color: #059669; }
    .del { border: none; background: #fff1f2; color: #e11d48; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 13px; }

    .empty { text-align: center; padding: 40px 16px; color: #94a3b8; font-size: 13px; }
    .loading { text-align: center; padding: 40px 16px; color: #94a3b8; font-size: 13px; }
    .load-more { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; color: #4f46e5; font-weight: 600; font-size: 13px; cursor: pointer; }
    .load-more:disabled { opacity: .5; cursor: default; }

    /* Bottom nav */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 448px; z-index: 4; display: flex; justify-content: space-around; align-items: center; padding: 8px 16px; background: rgba(255,255,255,.95); backdrop-filter: blur(16px); border-top: 1px solid rgba(226,232,240,.8); }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 12px; border: none; background: none; font-size: 10px; font-weight: 500; color: #94a3b8; cursor: pointer; text-decoration: none; }
    .nav-btn.active { color: #4f46e5; font-weight: 600; }
    .nav-btn .ico { font-size: 16px; }
    .fab { width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(45deg, #4f46e5, #9333ea); color: #fff; font-size: 22px; display: grid; place-items: center; margin-top: -24px; box-shadow: 0 10px 15px -3px rgba(79,70,229,.4); }

    /* Toast */
    .toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -20px); background: #1e293b; color: #fff; font-size: 14px; font-weight: 600; padding: 12px 16px; border-radius: 16px; opacity: 0; pointer-events: none; transition: all .3s; white-space: nowrap; z-index: 30; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">▣</div>
        <div>
          <div style="display:flex;align-items:center">
            <h1 class="brand-name">Transactions</h1>
            <span class="badge">History</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refreshBtn" onclick="load(true)" aria-label="Refresh">⟳</button>
        <a class="icon-btn ai-chat" href="ai.html" aria-label="AI Chat">
          <img class="ai-icon" src="ai-logo.png" alt="" />
        </a>
      </div>
    </header>

    <main class="content">
      <!-- Summary of filtered list -->
      <section class="summary">
        <div class="sum-box in">
          <div class="sum-label">⊕ Income</div>
          <div class="sum-value" id="sumIn">₹0.00</div>
        </div>
        <div class="sum-box out">
          <div class="sum-label">⊖ Expense</div>
          <div class="sum-value" id="sumOut">₹0.00</div>
        </div>
        <div class="sum-box balance">
          <div class="sum-label">Balance</div>
          <div class="sum-value" id="sumBalance">₹0.00</div>
        </div>
      </section>

      <!-- Filters -->
      <section style="display:flex;flex-direction:column;gap:12px">
        <div class="search-wrap">
          <span>🔍</span>
          <input class="search" id="searchInput" type="search" placeholder="Title / category search..." oninput="render()" />
        </div>
        <div class="chips" id="typeChips">
          <button class="chip active" data-type="all" onclick="setType(this)">All</button>
          <button class="chip" data-type="income" onclick="setType(this)">Income</button>
          <button class="chip" data-type="expense" onclick="setType(this)">Expense</button>
        </div>
        <select class="month-select" id="monthSelect" onchange="render()">
          <option value="">All months</option>
        </select>
      </section>

      <!-- List -->
      <section id="list" class="group">
        <div class="loading">Loading...</div>
      </section>

      <button class="load-more" id="moreBtn" onclick="loadMore()" hidden>Load more</button>
    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <a class="nav-btn" href="e.html"><span class="ico">⌂</span>Dashboard</a>
      <a class="nav-btn active" href="trans.html"><span class="ico">≡</span>Transactions</a>
      <a class="fab" href="e.html" aria-label="Add" style="text-decoration:none;display:grid;place-items:center">+</a>
      <a class="nav-btn" href="ana.html"><span class="ico">◔</span>Analytics</a>
      <a class="nav-btn" href="set.html"><span class="ico">⚟</span>Settings</a>
    </nav>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    /* ================= CONFIG ================= */
    const API_URL = "https://script.google.com/macros/s/AKfycbyVQBygHAXT1VRmvFGV7iDzKkNMRcQyW4hyf1Bp7v-p18pqwu3DaTt9sFICcLtA3C88/exec";
    const PAGE_SIZE = 50;       // ore thadavaiyil kaatura count
    const MAX_FETCH = 500;      // backend max limit

    const CATEGORY_ICONS = {
      'Shopping': { icon: '🛍', bg: '#e0e7ff' },
      'Food & Dining': { icon: '🍴', bg: '#ffedd5' },
      'Bills & Utilities': { icon: '🧾', bg: '#fef9c3' },
      'Travel & Transit': { icon: '✈', bg: '#dbeafe' },
      'Salary & Earnings': { icon: '💼', bg: '#d1fae5' },
      'Others': { icon: '•', bg: '#f1f5f9' }
    };

    /* ================= HELPERS ================= */
    const $ = id => document.getElementById(id);
    const fmt = n => Number(n || 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR' });
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function toast(msg, ok = true) {
      const t = $('toast');
      t.textContent = (ok ? '✓ ' : '✕ ') + msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function errMsg(err) {
      if (err && err.errors) return Object.values(err.errors)[0];
      return (err && (err.error || err.message)) || 'Something went wrong';
    }

    function monthLabel(ym) {
      const [y, m] = ym.split('-').map(Number);
      return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    }

    function dayLabel(ds) {
      const [y, m, d] = ds.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    /* ================= API ================= */
    async function apiGet(action, params = {}) {
      const qs = new URLSearchParams({ action, ...params }).toString();
      const res = await fetch(`${API_URL}?${qs}`);
      const data = await res.json();
      if (data.error) throw data;
      return data;
    }

    // Apps Script CORS ku text/plain use pannrom
    async function apiPost(action, body = {}) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...body })
      });
      const data = await res.json();
      if (data.error) throw data;
      return data;
    }

    /* ================= STATE ================= */
    let all = [];          // backend la irundhu varra full list
    let shown = PAGE_SIZE; // ethana row kaatanum

    /* ================= LOAD ================= */
    async function load(manual = false) {
      $('refreshBtn').disabled = true;
      try {
        const transactions = await apiGet('getTransactions', { limit: MAX_FETCH });
        all = transactions.map(transaction => {
          const category = String(transaction.category || '').trim();
          return {
            ...transaction,
            id: Number(transaction.id),
            category: !category || category === 'Others' ? 'Others' : category
          };
        });
        shown = PAGE_SIZE;
        buildMonthOptions();
        render();
        if (manual) toast('Updated');
      } catch (e) {
        $('list').innerHTML = `<div class="empty">Load aagala. ${esc(errMsg(e))}</div>`;
        toast(errMsg(e), false);
      } finally {
        $('refreshBtn').disabled = false;
      }
    }

    function buildMonthOptions() {
      const current = $('monthSelect').value;
      const months = [...new Set(all.map(t => t.occurred_on.slice(0, 7)))].sort().reverse();
      $('monthSelect').innerHTML =
        '<option value="">All months</option>' +
        months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
      if (months.includes(current)) $('monthSelect').value = current;
    }

    /* ================= FILTER ================= */
    let typeFilter = 'all';

    function setType(btn) {
      typeFilter = btn.dataset.type;
      document.querySelectorAll('#typeChips .chip').forEach(c => c.classList.toggle('active', c === btn));
      render();
    }

    function filtered() {
      const q = $('searchInput').value.trim().toLowerCase();
      const month = $('monthSelect').value;

      return all.filter(t => {
        if (typeFilter !== 'all' && t.type !== typeFilter) return false;
        if (month && !t.occurred_on.startsWith(month)) return false;
        if (q) {
          const hay = `${t.category} ${t.type} ${t.occurred_on}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    /* ================= RENDER ================= */
    function render() {
      const list = filtered();
      const inc = list.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const exp = list.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      $('sumIn').textContent = fmt(inc);
      $('sumOut').textContent = fmt(exp);
      $('sumBalance').textContent = fmt(inc - exp);

      if (!all.length) {
        $('list').innerHTML = '<div class="empty">Transaction illa. Dashboard la poi add pannunga.</div>';
        $('moreBtn').hidden = true;
        return;
      }
      if (!list.length) {
        $('list').innerHTML = '<div class="empty">Filter ku match aana transaction illa.</div>';
        $('moreBtn').hidden = true;
        return;
      }

      // Pagination
      const page = list.slice(0, shown);

      // Date wise group
      const groups = {};
      page.forEach(t => {
        (groups[t.occurred_on] ||= []).push(t);
      });

      $('list').innerHTML = Object.keys(groups).map(day => {
        const items = groups[day];
        const net = items.reduce((s, t) => s + (t.type === 'income' ? t.amount : -t.amount), 0);
        return `
          <div class="group" style="gap:8px">
            <div class="group-head">
              <span>${esc(dayLabel(day))}</span>
              <span class="group-net ${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '+' : '-'}${fmt(Math.abs(net))}</span>
            </div>
            ${items.map(txHTML).join('')}
          </div>`;
      }).join('');

      $('moreBtn').hidden = shown >= list.length;
      $('moreBtn').textContent = `Load more (${list.length - shown} left)`;
    }

    function txHTML(t) {
      const cat = CATEGORY_ICONS[t.category] || { icon: '•', bg: '#f1f5f9' };
      const isIn = t.type === 'income';
      return `
        <div class="tx">
          <div class="tx-left">
            <div class="tx-icon" style="background:${cat.bg}">${cat.icon}</div>
            <div style="min-width:0">
              <div class="tx-name">${esc(t.category || (isIn ? 'Income' : 'Expense'))}</div>
              <div class="tx-meta"><span class="cat">${esc(isIn ? 'Income' : 'Expense')}</span></div>
            </div>
          </div>
          <div class="tx-right">
            <div class="tx-amount ${isIn ? 'pos' : 'neg'}">${isIn ? '+' : '-'}${fmt(t.amount)}</div>
            <button class="del" onclick="removeTx(${Number(t.id)})" aria-label="Delete">🗑</button>
          </div>
        </div>`;
    }

    function loadMore() {
      shown += PAGE_SIZE;
      render();
    }

    /* ================= DELETE ================= */
    async function removeTx(id) {
      if (!confirm('Intha transaction ah delete pannalama?')) return;
      try {
        await apiPost('deleteTransaction', { id });
        all = all.filter(t => Number(t.id) !== Number(id));
        render();
        toast('Deleted');
      } catch (e) {
        toast(errMsg(e), false);
      }
    }

    /* ================= INIT ================= */
    load();
  </script>
</body>
</html>
